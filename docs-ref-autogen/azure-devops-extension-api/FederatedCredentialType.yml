### YamlMime:TSEnum
name: FederatedCredentialType
uid: azure-devops-extension-api.FederatedCredentialType
package: azure-devops-extension-api
summary: >-
  The types of federated credentials criteria that can be used to validate
  external credentials. This enum is used for the Type property and is persisted
  as the integer TypeKey column on the federated credential tables (the column
  name ends in "Key" to allow normalizing into its own table later).
fullName: FederatedCredentialType
remarks: ''
isDeprecated: false
fields:
  - name: GitHubActions
    uid: azure-devops-extension-api.FederatedCredentialType.GitHubActions
    package: azure-devops-extension-api
    summary: >-
      A federated credential from a GitHub Actions workflow, using GitHub's OIDC
      provider (issuer: https://token.actions.githubusercontent.com).
    numericValue: 0

### YamlMime:TSType
name: FederatedCredentialPolicy
uid: azure-devops-extension-api.FederatedCredentialPolicy
package: azure-devops-extension-api
summary: >-
  Defines which federated credentials can operate on behalf of a user. The
  policy is used to evaluate an incoming federated credential and define what
  actions can be taken on behalf of the user. A policy is scoped to a single
  publisher; the exchanged credential inherits the creator's role on that
  publisher.
fullName: FederatedCredentialPolicy
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: created
    uid: azure-devops-extension-api.FederatedCredentialPolicy.created
    package: azure-devops-extension-api
    summary: When this entity was first created. The timestamp is in UTC.
    fullName: created
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'created: Date'
      return:
        description: ''
        type: Date
  - name: createdByIdentityId
    uid: azure-devops-extension-api.FederatedCredentialPolicy.createdByIdentityId
    package: azure-devops-extension-api
    summary: >-
      The ADO identity that created this policy. The exchanged credential will
      act as this identity, inheriting their role on the publisher (Owner,
      Contributor).
    fullName: createdByIdentityId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'createdByIdentityId: string'
      return:
        description: ''
        type: string
  - name: criteria
    uid: azure-devops-extension-api.FederatedCredentialPolicy.criteria
    package: azure-devops-extension-api
    summary: >-
      A JSON object used to evaluate whether a token matches a user-provided
      pattern. Some criteria may be implied by the Type and may not be
      explicitly stated here.
    fullName: criteria
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'criteria: string'
      return:
        description: ''
        type: string
  - name: key
    uid: azure-devops-extension-api.FederatedCredentialPolicy.key
    package: azure-devops-extension-api
    summary: >-
      The unique key for this federated credential policy. Generated by the
      database.
    fullName: key
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'key: number'
      return:
        description: ''
        type: number
  - name: lastMatched
    uid: azure-devops-extension-api.FederatedCredentialPolicy.lastMatched
    package: azure-devops-extension-api
    summary: >-
      When this policy was last evaluated against an external credential and it
      matched. The timestamp is in UTC. Null until the first match.
    fullName: lastMatched
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'lastMatched: Date'
      return:
        description: ''
        type: Date
  - name: policyName
    uid: azure-devops-extension-api.FederatedCredentialPolicy.policyName
    package: azure-devops-extension-api
    summary: >-
      An optional human-readable label for this policy (e.g., "Release
      workflow"). Not used when matching credentials.
    fullName: policyName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'policyName: string'
      return:
        description: ''
        type: string
  - name: publisherId
    uid: azure-devops-extension-api.FederatedCredentialPolicy.publisherId
    package: azure-devops-extension-api
    summary: >-
      The publisher that this policy grants access to. The exchanged credential
      will be scoped to this publisher. Used to look up trust policies when a
      token exchange request arrives.
    fullName: publisherId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'publisherId: string'
      return:
        description: ''
        type: string
  - name: type
    uid: azure-devops-extension-api.FederatedCredentialPolicy.type
    package: azure-devops-extension-api
    summary: A type enum determining how the Criteria field should be interpreted.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: GitHubActions'
      return:
        description: ''
        type: >-
          <xref
          uid="azure-devops-extension-api.FederatedCredentialType.GitHubActions"
          />
